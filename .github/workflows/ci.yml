name: CI

on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [develop]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,jsx,css}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend — Schema Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: hrms-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: hrms-backend
        run: npm ci

      - name: Validate GraphQL schema
        working-directory: hrms-backend
        run: |
          node -e "
            import('./src/schema.js')
              .then(() => { console.log('✅ GraphQL schema compiled successfully'); })
              .catch(e => { console.error('❌ Schema error:', e.message); process.exit(1); });
          "
